<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>select</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:rgba(10,11,14,.42);cursor:crosshair}
  body{font:13px/1.4 "Segoe UI","Microsoft YaHei UI",sans-serif;color:#e8e9ed}
  #box{
    position:fixed;display:none;
    border:1px solid #7aa2f7;
    background:rgba(122,162,247,.10);
    box-shadow:0 0 0 9999px rgba(10,11,14,.28);
    pointer-events:none;
  }
  #size{
    position:absolute;left:0;top:-24px;
    font-size:11px;color:#c9d6f5;
    background:rgba(12,14,18,.85);border:1px solid rgba(255,255,255,.12);
    border-radius:4px;padding:1px 6px;white-space:nowrap;
  }
  #hint{
    position:fixed;left:50%;top:28px;transform:translateX(-50%);
    background:rgba(12,14,18,.88);border:1px solid rgba(255,255,255,.1);
    border-radius:8px;padding:8px 14px;font-size:12.5px;color:#c7cbd4;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
  }
  #hint kbd{
    font:11px/1 Consolas,monospace;border:1px solid rgba(255,255,255,.2);
    border-radius:4px;padding:2px 5px;margin:0 2px;color:#e8e9ed;
  }
  #cancel{
    position:fixed;top:16px;right:16px;z-index:10;
    width:34px;height:34px;border-radius:8px;cursor:pointer;
    display:grid;place-items:center;
    background:rgba(20,22,26,.92);border:1px solid rgba(255,255,255,.14);
    color:#cfd4dd;font-size:15px;line-height:1;
    -webkit-app-region:no-drag;
  }
  #cancel:hover{background:#b3382c;border-color:transparent;color:#fff}
</style>
</head>
<body>
  <button id="cancel" title="取消 (Esc)">✕</button>
  <div id="hint">拖拽框选要识别的区域 · <kbd>Esc</kbd> 取消</div>
  <div id="box"><div id="size"></div></div>
<script>
const { ipcRenderer } = require('electron');
const box = document.getElementById('box');
const size = document.getElementById('size');
const hint = document.getElementById('hint');
let sx = 0, sy = 0, dragging = false;

function paint(x, y, w, h) {
  box.style.display = 'block';
  box.style.left = x + 'px';
  box.style.top = y + 'px';
  box.style.width = w + 'px';
  box.style.height = h + 'px';
  size.textContent = w + ' × ' + h;
}

function norm(x1, y1, x2, y2) {
  return {
    x: Math.min(x1, x2), y: Math.min(y1, y2),
    w: Math.abs(x2 - x1), h: Math.abs(y2 - y1),
  };
}

window.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  dragging = true;
  sx = e.clientX; sy = e.clientY;
  hint.style.display = 'none';
  paint(sx, sy, 0, 0);
});

window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const r = norm(sx, sy, e.clientX, e.clientY);
  paint(r.x, r.y, r.w, r.h);
});

window.addEventListener('mouseup', (e) => {
  if (!dragging) return;
  dragging = false;
  const r = norm(sx, sy, e.clientX, e.clientY);
  if (r.w < 8 || r.h < 8) { ipcRenderer.send('shot:cancel'); return; }
  box.style.display = 'none';
  ipcRenderer.send('shot:rect', r);
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') ipcRenderer.send('shot:cancel');
});

document.getElementById('cancel').addEventListener('click', (e) => {
  e.stopPropagation();
  ipcRenderer.send('shot:cancel');
});

ipcRenderer.on('shot:reset', () => {
  dragging = false;
  box.style.display = 'none';
  hint.style.display = '';
});
</script>
</body>
</html>
